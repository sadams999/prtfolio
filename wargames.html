<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.4/lib/p5.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.4/lib/addons/p5.sound.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/planck@1.0.0/dist/planck.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5play@3/p5play.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
  <script src="wargames.js"></script>
</head>
<body>
  <a href="index.html" class="back-home-btn">&lt; back to portfolio</a>

<style>
  .back-home-btn{
    position:fixed;
    top:18px;
    left:18px;
    z-index:999;
    font-family:'JetBrains Mono', 'Courier New', monospace;
    font-size:13px;
    font-weight:600;
    color:#1C1B19;
    text-decoration:none;
    background:rgba(243,239,229,0.92);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border:1.5px solid #E2DBC9;
    padding:9px 16px;
    border-radius:999px;
    box-shadow:0 6px 18px rgba(28,27,25,0.12);
    transition:border-color .15s ease, transform .15s ease;
  }
  .back-home-btn:hover{
    border-color:#7C71C9;
    transform:translateX(-3px);
  }
  @media (max-width:640px){
    .back-home-btn{ top:12px; left:12px; padding:7px 12px; font-size:12px; }
  }
</style>
</body>
</html>
